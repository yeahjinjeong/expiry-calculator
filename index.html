<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="유통기한" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>내부품질기한 계산기</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #ffffff;
      --bg2: #f5f5f3;
      --bg3: #ebebea;
      --text: #1a1a18;
      --text2: #6b6b67;
      --text3: #a8a8a4;
      --border: rgba(0,0,0,0.1);
      --border2: rgba(0,0,0,0.18);
      --radius-md: 8px;
      --radius-lg: 12px;
      --ok-bg: #EAF3DE; --ok-text: #3B6D11;
      --warn-bg: #FAEEDA; --warn-text: #854F0B;
      --exp-bg: #FCEBEB; --exp-text: #A32D2D;
      --accent: #1a1a18;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1c1c1a;
        --bg2: #252523;
        --bg3: #2e2e2c;
        --text: #f0f0ee;
        --text2: #a0a09c;
        --text3: #6a6a66;
        --border: rgba(255,255,255,0.1);
        --border2: rgba(255,255,255,0.18);
        --ok-bg: #27500A; --ok-text: #C0DD97;
        --warn-bg: #633806; --warn-text: #FAC775;
        --exp-bg: #791F1F; --exp-text: #F7C1C1;
      }
    }

    html, body {
      height: 100%;
      background: var(--bg2);
      color: var(--text);
      font-family: -apple-system, 'Helvetica Neue', Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body { display: flex; flex-direction: column; height: 100dvh; }

    header {
      background: var(--bg);
      border-bottom: 0.5px solid var(--border);
      padding: 14px 16px 12px;
      flex-shrink: 0;
    }

    .header-title {
      font-size: 20px;
      font-weight: 600;
      letter-spacing: -0.3px;
      margin-bottom: 10px;
    }

    .now-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--bg2);
      border-radius: var(--radius-lg);
      padding: 10px 12px;
    }

    .now-label { font-size: 11px; color: var(--text3); margin-bottom: 2px; }
    .now-time { font-size: 17px; font-weight: 500; font-variant-numeric: tabular-nums; letter-spacing: -0.2px; }

    .edit-btn {
      background: var(--bg);
      border: 0.5px solid var(--border2);
      border-radius: var(--radius-md);
      padding: 6px 12px;
      font-size: 13px;
      color: var(--text2);
      cursor: pointer;
    }

    .time-editor {
      background: var(--bg2);
      border-top: 0.5px solid var(--border);
      padding: 12px 16px;
      display: none;
      flex-shrink: 0;
    }
    .time-editor.open { display: block; }
    .time-editor-label { font-size: 11px; color: var(--text3); margin-bottom: 8px; }
    .time-editor-row { display: flex; gap: 8px; align-items: center; }
    .time-editor-row input[type="datetime-local"] {
      flex: 1;
      font-size: 14px;
      padding: 8px 10px;
      border-radius: var(--radius-md);
      border: 0.5px solid var(--border2);
      background: var(--bg);
      color: var(--text);
      min-width: 0;
    }
    .btn-sm {
      font-size: 13px;
      padding: 7px 14px;
      border-radius: var(--radius-md);
      border: 0.5px solid var(--border2);
      background: var(--bg);
      color: var(--text);
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .btn-sm.muted { color: var(--text2); }

    .scroll-area {
      flex: 1;
      overflow-y: auto;
      padding: 14px 16px;
      -webkit-overflow-scrolling: touch;
    }

    .section-label {
      font-size: 11px;
      color: var(--text3);
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .items-list { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-bottom: 12px; }
    .item-card.editing { grid-column: 1 / -1; }

    .item-card {
      background: var(--bg);
      border: 0.5px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 12px 14px;
      transition: border-color 0.15s;
    }
    .item-card.editing { border-color: var(--border2); background: var(--bg2); }

    .item-top { display: flex; align-items: flex-start; gap: 8px; }
    .item-info { flex: 1; min-width: 0; }
    .item-name { font-size: 15px; font-weight: 500; margin-bottom: 4px; }
    .item-meta { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .item-expire { font-size: 13px; color: var(--text2); }

    .badge {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 999px;
      font-weight: 500;
      white-space: nowrap;
    }
    .badge-ok  { background: var(--ok-bg);   color: var(--ok-text); }
    .badge-warn{ background: var(--warn-bg);  color: var(--warn-text); }
    .badge-exp { background: var(--exp-bg);   color: var(--exp-text); }

    .item-actions { display: flex; gap: 2px; flex-shrink: 0; }
    .icon-btn {
      background: none;
      border: none;
      cursor: pointer;
      padding: 6px;
      border-radius: 8px;
      color: var(--text3);
      font-size: 18px;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .icon-btn:active { background: var(--bg3); }

    .edit-form { margin-top: 12px; display: flex; flex-direction: column; gap: 8px; }
    .form-row { display: flex; gap: 8px; align-items: center; }
    .form-row label { font-size: 12px; color: var(--text2); min-width: 32px; flex-shrink: 0; }
    .form-row input[type="text"],
    .form-row input[type="number"],
    .form-row select {
      flex: 1;
      font-size: 14px;
      padding: 7px 10px;
      border-radius: var(--radius-md);
      border: 0.5px solid var(--border2);
      background: var(--bg);
      color: var(--text);
      min-width: 0;
    }
    .form-row input[type="number"] { max-width: 80px; flex: none; }
    .form-btns { display: flex; gap: 6px; justify-content: flex-end; }
    .btn-save { font-size: 13px; padding: 6px 16px; border-radius: var(--radius-md); border: 0.5px solid var(--border2); background: var(--text); color: var(--bg); cursor: pointer; }
    .btn-cancel { font-size: 13px; padding: 6px 16px; border-radius: var(--radius-md); border: 0.5px solid var(--border); background: none; color: var(--text2); cursor: pointer; }

    .add-form {
      background: var(--bg2);
      border: 0.5px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 12px;
    }
    .add-form-title { font-size: 12px; color: var(--text2); margin-bottom: 2px; }

    .add-toggle {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background: none;
      border: 0.5px dashed var(--border2);
      border-radius: var(--radius-lg);
      padding: 12px;
      font-size: 14px;
      color: var(--text2);
      cursor: pointer;
      width: 100%;
    }
    .add-toggle:active { background: var(--bg3); }

    .empty-state {
      text-align: center;
      padding: 3rem 0;
      color: var(--text3);
      font-size: 14px;
    }
    .empty-icon { font-size: 36px; margin-bottom: 8px; }
  </style>
</head>
<body>

<header>
  <div class="header-title">내부품질기한 계산기</div>
  <div class="now-row">
    <div>
      <div class="now-label">기준 시각</div>
      <div class="now-time" id="now-display">—</div>
    </div>
    <button class="edit-btn" onclick="toggleTimeEditor()">수정</button>
  </div>
</header>

<div class="time-editor" id="time-editor">
  <div class="time-editor-label">기준 시각 직접 설정</div>
  <div class="time-editor-row">
    <input type="datetime-local" id="custom-time" />
    <button class="btn-sm" onclick="applyCustomTime()">적용</button>
    <button class="btn-sm muted" onclick="resetTime()">현재</button>
  </div>
</div>

<div class="scroll-area">
  <div class="section-label">항목 목록</div>
  <div class="items-list" id="items-list"></div>
  <div id="add-area"></div>
</div>

<script>
const STORAGE_KEY = 'expiry_items_v2';
const TIME_KEY = 'expiry_basetime_v2';

let baseTime = null;
let items = [];
let editingId = null;
let showAddForm = false;
let ticker = null;

function loadData() {
  try { const r = localStorage.getItem(STORAGE_KEY); if (r) items = JSON.parse(r); } catch(e) { items = []; }
  try { const t = localStorage.getItem(TIME_KEY); if (t) baseTime = new Date(t); } catch(e) { baseTime = null; }
}

function saveItems() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(items)); } catch(e) {}
}

function saveBaseTime() {
  try {
    if (baseTime) localStorage.setItem(TIME_KEY, baseTime.toISOString());
    else localStorage.removeItem(TIME_KEY);
  } catch(e) {}
}

function getNow() { return baseTime ? new Date(baseTime) : new Date(); }

// function fmt(dt) {
//   const p = n => String(n).padStart(2,'0');
//   return `${dt.getFullYear()}.${p(dt.getMonth()+1)}.${p(dt.getDate())} ${p(dt.getHours())}:${p(dt.getMinutes())}`;
// }
// function fmtDate(dt) {
//   const p = n => String(n).padStart(2,'0');
//   return `${dt.getFullYear()}.${p(dt.getMonth()+1)}.${p(dt.getDate())}`;
// }

const DAYS = ['일','월','화','수','목','금','토'];
function fmt(dt) {
  const p = n => String(n).padStart(2,'0');
  return `${dt.getFullYear()}.${p(dt.getMonth()+1)}.${p(dt.getDate())}(${DAYS[dt.getDay()]}) ${p(dt.getHours())}:${p(dt.getMinutes())}`;
}
function fmtDate(dt) {
  const p = n => String(n).padStart(2,'0');
  return `${dt.getFullYear()}.${p(dt.getMonth()+1)}.${p(dt.getDate())}(${DAYS[dt.getDay()]})`;
}

function calcExpiry(item) {
  const now = getNow();
  const val = parseInt(item.value, 10);
  if (!val || val <= 0) return null;
  const exp = new Date(now);
  if (item.unit === 'hours') {
    exp.setHours(exp.getHours() + val);
    return { dt: exp, display: fmt(exp) };
  } else {
    if (item.unit === 'months') {
      exp.setMonth(exp.getMonth() + val);
      exp.setDate(exp.getDate() - 1);
      exp.setHours(23, 59, 59, 0);
    } else {
      const days = item.unit === 'weeks' ? val * 7 : val;
      exp.setDate(exp.getDate() + days - 1);
      exp.setHours(23, 59, 59, 0);
    }
    return { dt: exp, display: fmtDate(exp) };
  }
}

function getStatus(expDt) {
  const diff = expDt - getNow();
  if (diff < 0) return 'exp';
  if (diff < 4 * 3600 * 1000) return 'warn';
  return 'ok';
}

function statusBadge(status, expDt) {
  const diff = expDt - getNow();
  if (status === 'exp') return `<span class="badge badge-exp">폐기됨</span>`;
  if (status === 'warn') {
    const h = Math.floor(diff / 3600000);
    const m = Math.floor((diff % 3600000) / 60000);
    return `<span class="badge badge-warn">${h}시간 ${m}분 남음</span>`;
  }
  const days = Math.floor(diff / 86400000);
  if (days > 0) return `<span class="badge badge-ok">${days}일 남음</span>`;
  const h = Math.floor(diff / 3600000);
  return `<span class="badge badge-ok">${h}시간 남음</span>`;
}

function unitLabel(u) { return { hours:'시간', days:'일', weeks:'주', months:'개월' }[u] || u; }
function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2,6); }

function renderNow() {
  document.getElementById('now-display').textContent = fmt(getNow());
}

function renderItems() {
  const list = document.getElementById('items-list');
  if (!items.length) {
    list.innerHTML = `<div class="empty-state"><div class="empty-icon">📦</div>항목을 추가해보세요</div>`;
    return;
  }
  list.innerHTML = items.map(item => {
    const exp = calcExpiry(item);
    const isEditing = editingId === item.id;
    let expiryStr = '—', badgeHtml = '';
    if (exp) {
      expiryStr = exp.display;
      badgeHtml = statusBadge(getStatus(exp.dt), exp.dt);
    }
    if (isEditing) return `
      <div class="item-card editing">
        <div class="item-name">${esc(item.name)}</div>
        <div class="edit-form">
          <div class="form-row"><label>이름</label><input type="text" id="en-${item.id}" value="${esc(item.name)}" /></div>
          <div class="form-row">
            <label>기간</label>
            <input type="number" id="ev-${item.id}" value="${item.value}" min="1" max="9999" />
            <select id="eu-${item.id}">
              <option value="hours"${item.unit==='hours'?' selected':''}>시간</option>
              <option value="days"${item.unit==='days'?' selected':''}>일</option>
              <option value="weeks"${item.unit==='weeks'?' selected':''}>주</option>
              <option value="months"${item.unit==='months'?' selected':''}>개월</option>
            </select>
          </div>
          <div class="form-btns">
            <button class="btn-cancel" onclick="cancelEdit()">취소</button>
            <button class="btn-save" onclick="saveEdit('${item.id}')">저장</button>
          </div>
        </div>
      </div>`;
    return `
      <div class="item-card">
        <div class="item-top">
          <div class="item-info">
            <div class="item-name">${esc(item.name)}</div>
            <div class="item-meta">
              <span class="item-expire">${item.value}${unitLabel(item.unit)} → ${expiryStr}</span>
              ${badgeHtml}
            </div>
          </div>
          <div class="item-actions">
            <button class="icon-btn" onclick="startEdit('${item.id}')" aria-label="수정">✏️</button>
            <button class="icon-btn" onclick="deleteItem('${item.id}')" aria-label="삭제">🗑️</button>
          </div>
        </div>
      </div>`;
  }).join('');
}

function renderAddArea() {
  const area = document.getElementById('add-area');
  if (!showAddForm) {
    area.innerHTML = `<button class="add-toggle" onclick="openAddForm()">＋ 항목 추가</button>`;
    return;
  }
  area.innerHTML = `
    <div class="add-form">
      <div class="add-form-title">새 항목 추가</div>
      <div class="form-row"><label>이름</label><input type="text" id="new-name" placeholder="예) 샐러드" /></div>
      <div class="form-row">
        <label>기간</label>
        <input type="number" id="new-val" value="24" min="1" max="9999" />
        <select id="new-unit">
          <option value="hours">시간</option>
          <option value="days">일</option>
          <option value="weeks">주</option>
          <option value="months">개월</option>
        </select>
      </div>
      <div class="form-btns">
        <button class="btn-cancel" onclick="closeAddForm()">취소</button>
        <button class="btn-save" onclick="addItem()">추가</button>
      </div>
    </div>`;
  setTimeout(() => { const el = document.getElementById('new-name'); if(el) el.focus(); }, 50);
}

function render() { renderNow(); renderItems(); renderAddArea(); }

function toggleTimeEditor() {
  const ed = document.getElementById('time-editor');
  ed.classList.toggle('open');
  if (ed.classList.contains('open')) {
    const now = getNow();
    const local = new Date(now.getTime() - now.getTimezoneOffset()*60000);
    document.getElementById('custom-time').value = local.toISOString().slice(0,16);
  }
}

function applyCustomTime() {
  const v = document.getElementById('custom-time').value;
  if (!v) return;
  baseTime = new Date(v);
  saveBaseTime();
  if (ticker) { clearInterval(ticker); ticker = null; }
  document.getElementById('time-editor').classList.remove('open');
  render();
}

function resetTime() {
  baseTime = null;
  localStorage.removeItem(TIME_KEY);
  document.getElementById('time-editor').classList.remove('open');
  startTicker();
  render();
}

function startTicker() {
  if (ticker) clearInterval(ticker);
  if (!baseTime) ticker = setInterval(() => { renderNow(); renderItems(); }, 30000);
}

function addItem() {
  const name = (document.getElementById('new-name').value || '').trim();
  const val = parseInt(document.getElementById('new-val').value, 10);
  const unit = document.getElementById('new-unit').value;
  if (!name) { document.getElementById('new-name').focus(); return; }
  if (!val || val <= 0) return;
  items.push({ id: uid(), name, value: val, unit });
  saveItems();
  showAddForm = false;
  render();
}

function openAddForm() { showAddForm = true; editingId = null; render(); }
function closeAddForm() { showAddForm = false; render(); }
function startEdit(id) { editingId = id; showAddForm = false; render(); }
function cancelEdit() { editingId = null; render(); }

function saveEdit(id) {
  const name = (document.getElementById(`en-${id}`).value || '').trim();
  const val = parseInt(document.getElementById(`ev-${id}`).value, 10);
  const unit = document.getElementById(`eu-${id}`).value;
  if (!name || !val || val <= 0) return;
  const idx = items.findIndex(i => i.id === id);
  if (idx >= 0) items[idx] = { ...items[idx], name, value: val, unit };
  saveItems();
  editingId = null;
  render();
}

function deleteItem(id) {
  if (!confirm(`"${items.find(i=>i.id===id)?.name}" 항목을 삭제할까요?`)) return;
  items = items.filter(i => i.id !== id);
  saveItems();
  if (editingId === id) editingId = null;
  render();
}

loadData();
render();
startTicker();
</script>
</body>
</html>
